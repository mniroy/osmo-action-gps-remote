; PlatformIO Project Configuration
; Osmo Action GPS Remote — ESP32-C6 Super Mini
; Hardware: ESP32-C6 Super Mini + GY-GPSV3-NEO-M8M + Momentary Switch
;
; GPIO Mapping:
;   GPS TX (module) -> GPIO 16 (ESP RX)
;   GPS RX (module) -> GPIO 17 (ESP TX)
;   Button          -> GPIO 20

[env:esp32c6-supermini]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L

; Serial port for upload and monitor
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
monitor_speed = 115200

; Build flags
build_flags =
    -DESP_PLATFORM

; Upload protocol
upload_protocol = esptool

; Extra scripts for ESP-IDF custom sdkconfig
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
